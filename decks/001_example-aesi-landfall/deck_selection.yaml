commander: aesi-tyrant-of-gyre-strait
archetype: landfall_value
power_level: 7
power_level_fit: >
  Strong (example). Landfall strategy fits Aesi naturally. Focused 7 — fast enough to
  be threatening by turn 4-5, not so fast it dominates lower-power tables. No tutors,
  no infinite combos.

strategy_hook: >
  Ramp to 6 mana for Aesi, stack extra-land-drop effects (Exploration, Burgeoning,
  Oracle of Mul Daya) to draw 3-5 cards per turn cycle, then threaten through token
  mass or Craterhoof. Storm Cauldron is the soft-lock: bounce lands back each turn and
  replay them for additional Aesi triggers.

